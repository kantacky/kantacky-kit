name: Deploy DocC to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    strategy:
      matrix:
        target:
          - Camera
          - HeadphoneMotion
          - ImageClassification
    steps:
      - uses: actions/checkout@v6
      - name: Setup Xcode
        run: xcodes select
      - name: Build DocC for ${{ matrix.target }}
        run: |
          mkdir -p ./docs
          swift package --allow-writing-to-directory ./docs generate-documentation \
          --target ${{ matrix.target }} \
          --disable-indexing \
          --output-path ./docs \
          --transform-for-static-hosting \
          --hosting-base-path kantacky-kit
      - uses: actions/upload-artifact@v7
        id: docs
        with:
          path: docs

  deploy:
    needs: merge
    runs-on: macos-26
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: docs
        uses: actions/deploy-pages@v4
