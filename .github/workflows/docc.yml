name: Deploy DocC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    strategy:
      matrix:
        target: [Camera, HeadphoneMotion, ImageClassification]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        run: xcodes select

      - name: Build DocC for ${{ matrix.target }}
        run: |
          mkdir -p ./docs/${{ matrix.target }}
          swift package --allow-writing-to-directory ./docs/${{ matrix.target }} generate-documentation \
          --target ${{ matrix.target }} \
          --disable-indexing \
          --output-path ./docs/${{ matrix.target }} \
          --transform-for-static-hosting \
          --hosting-base-path kantacky-kit

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ matrix.target }}
          path: docs/${{ matrix.target }}

  merge:
    needs: build
    runs-on: macos-26
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: docs
          pattern: docs-*
          merge-multiple: true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: merge
    runs-on: macos-26
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
